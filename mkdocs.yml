site_name: Theoretical Physics Lab
site_url: https://alexeykozhakin.github.io/theoretical-physics-lab/
repo_url: https://github.com/AlexeyKozhakin/theoretical-physics-lab
repo_name: theoretical-physics-lab
edit_uri: edit/main/

# Заметки лежат рядом с кодом, а не в docs/
docs_dir: .
exclude_docs: |
  papers/
  site/
  code/
  figures/.gitkeep
  .github/
  requirements.txt

plugins:
  - same-dir
  - search:
      lang: [ru, en]

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Главная: README.md
  - CDW в магнитном поле:
      - cdw-magnetic/README.md
      - Дорожная карта: cdw-magnetic/ROADMAP.md
      - Постановки задач: cdw-magnetic/tasks.md
      - Вопросы и решения: cdw-magnetic/questions.md
      - Журнал результатов: cdw-magnetic/findings.md
      - "Ветка A: TDP с CDW-анзацем":
          - 00. Рабочий план при конечном T: cdw-magnetic/notes/00-plan.md
          - 01. Модель и анзац: cdw-magnetic/notes/01-setup.md
          - 02. Смешивание уровней Ландау: cdw-magnetic/notes/02-difficulty.md
          - 03. Предельные случаи: cdw-magnetic/notes/03-limits.md
          - 04. Перенормировка и аномалия: cdw-magnetic/notes/04-renorm.md
          - 05. Стратегия аналитического TDP: cdw-magnetic/notes/05-strategy.md
          - 06. Модель Раби и тепловое ядро: cdw-magnetic/notes/06-rabi-heat-kernel.md
          - 07. Начало вывода и проверка AQRM: cdw-magnetic/notes/07-derivation-operators.md
          - 08. Тепловой след и вакуумный потенциал: cdw-magnetic/notes/08-heat-kernel-vacuum.md
          - 09. Полный TDP при произвольном μ: cdw-magnetic/notes/09-finite-density.md
          - 10. Проверка предела B → 0: cdw-magnetic/notes/10-zero-field-limit.md
          - 11. Относительный определитель и численный базис: cdw-magnetic/notes/11-relative-determinant.md
          - 12. Границы базиса и однородные минимумы: cdw-magnetic/notes/12-basis-bounds-and-homogeneous.md
          - 13. Адаптивный поиск и кандидат CDW: cdw-magnetic/notes/13-adaptive-search-and-cdw-candidate.md
          - 14. Уточнение локального минимума CDW: cdw-magnetic/notes/14-local-cdw-minimum.md
          - 15. Продолжение кандидата и бесполевой контроль: cdw-magnetic/notes/15-continuation-and-zero-field-control.md
          - 16. Первая предварительная карта фаз: cdw-magnetic/notes/16-preliminary-phase-map.md
          - 17. Быстрый движок карт: cdw-magnetic/notes/17-fast-engine.md
          - 18. Адаптивная карта фаз: cdw-magnetic/notes/18-adaptive-map.md
          - 19. Однородная задача: cdw-magnetic/notes/19-homogeneous.md
      - "Ветка B: анализ устойчивости":
          - B0. План и трудности: cdw-magnetic/notes/stability/00-plan.md
          - B1. Уточнённая постановка: cdw-magnetic/notes/stability/01-setup.md
          - B2. Устойчивость при B = 0: cdw-magnetic/notes/stability/02-zero-field.md
          - B3. Пропагатор в поле: cdw-magnetic/notes/stability/03-propagator.md
